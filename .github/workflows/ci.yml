name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system deps (tesseract + OpenCV libs + fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-eng fonts-dejavu-core \
            libgl1 libglib2.0-0 libgomp1

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache vendor models
        uses: actions/cache@v4
        with:
          path: pipeline/vendor/models
          key: vendor-models-${{ hashFiles('scripts/setup_vendor.sh') }}

      - name: Provision vendor models
        run: bash scripts/setup_vendor.sh

      - name: Check committed model asset
        run: test -f pipeline/vendor/models/face_landmarker.task

      - name: Run backend tests
        run: python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
