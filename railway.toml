# Railway config-as-code — overrides any dashboard Custom Start Command.
# Previous shell form `sh -c 'exec python -m uvicorn ... --port ${PORT:-8000}'` also
# fixes the literal '${PORT:-8000}' crash, but Python launcher is bulletproof
# even when the platform runs start in exec form without a shell.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile.backend"

[deploy]
startCommand = "python start.py"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
